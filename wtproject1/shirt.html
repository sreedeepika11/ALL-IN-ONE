<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Men's Shirt Collection</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .shirt-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-top: 30px;
    }

    .shirt-card {
      width: 220px;
      border: 1px solid #ddd;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
      transition: transform 0.3s;
      position: relative;
      background: #fff;
      padding-bottom: 10px;
    }

    .shirt-card:hover {
      transform: scale(1.05);
    }

    .shirt-card img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      cursor: pointer;
    }

    .wishlist {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 24px;
      cursor: pointer;
      border: 2px solid black;
      border-radius: 50%;
      background: white;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .wishlist::before {
      content: '\2661';
      color: black;
    }

    .wishlist.red::before {
      content: '\2665';
      color: red;
    }

    .details {
      padding: 10px;
      text-align: left;
    }

    .price {
      color: red;
      font-weight: bold;
    }

    .rating {
      color: orange;
    }

    .add-to-bag {
      display: none;
      width: 100%;
      background: black;
      color: white;
      padding: 10px;
      border: none;
      cursor: pointer;
      margin-top: 10px;
      text-align: center;
    }

    .shirt-card:hover .add-to-bag {
      display: block;
    }

    .add-to-bag:hover {
      background: #333;
    }

    .size-chart {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .size-chart input[type="radio"] {
      display: none;
    }

    .size-chart label {
      border: 1px solid #999;
      padding: 6px 10px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s ease-in-out;
      user-select: none;
    }

    .size-chart input[type="radio"]:checked + label {
      border-color: black;
      color: #fff;
      background-color: black;
    }

    .size-chart label:hover {
      background-color: #f0f0f0;
    }
  </style>
</head>
<body>
  <h2>Men's Shirt Collection</h2>
  <div class="shirt-container">
    <script>
      const shirts = [
        { img: "/home/rgukt123/Documents/wtproject1/d1.jpg", name: "Casual Blue Shirt", rating: "★★★★☆ (80)", price: "Rs. 999.00" },
        { img: "/home/rgukt123/Documents/wtproject1/d2.jpg", name: "Formal White Shirt", rating: "★★★★★ (120)", price: "Rs. 1,199.00" },
        { img: "/home/rgukt123/Documents/wtproject1/d3.jpg", name: "Black Slim Fit Shirt", rating: "★★★★☆ (65)", price: "Rs. 899.00" },
        { img: "/home/rgukt123/Documents/wtproject1/d4.jpg", name: "Printed Yellow Shirt", rating: "★★★★☆ (77)", price: "Rs. 1,099.00" },
        { img: "/home/rgukt123/Documents/wtproject1/d5.jpg", name: "Grey Checks Shirt", rating: "★★★★★ (110)", price: "Rs. 1,299.00" },
        { img: "/home/rgukt123/Documents/wtproject1/d6.jpg", name: "Sky Blue Cotton Shirt", rating: "★★★★☆ (90)", price: "Rs. 1,049.00" },
        { img: "/home/rgukt123/Documents/wtproject1/d7.jpg", name: "Green Casual Shirt", rating: "★★★★★ (103)", price: "Rs. 1,199.00" },
        { img: "/home/rgukt123/Documents/wtproject1/d8.jpg", name: "Maroon Party Shirt", rating: "★★★★☆ (85)", price: "Rs. 1,499.00" },
        { img: "/home/rgukt123/Documents/wtproject1/d9.jpg", name: "White Linen Shirt", rating: "★★★★☆ (92)", price: "Rs. 1,399.00" },
        { img: "/home/rgukt123/Documents/wtproject1/d10.jpg", name: "Navy Blue Slim Shirt", rating: "★★★★★ (134)", price: "Rs. 1,249.00" }
      ];

      shirts.forEach((shirt, index) => {
        document.write(`
          <div class="shirt-card">
            <span class="wishlist" onclick="toggleWishlist(this)"></span>
            <img src="${shirt.img}" alt="${shirt.name}">
            <div class="details">
              <p>${shirt.name}</p>
              <p class="rating">${shirt.rating}</p>
              <p class="price">${shirt.price}</p>
              <div class="size-chart">
                <input type="radio" name="size-${index}" id="s-${index}">
                <label for="s-${index}">S</label>
                <input type="radio" name="size-${index}" id="m-${index}">
                <label for="m-${index}">M</label>
                <input type="radio" name="size-${index}" id="l-${index}">
                <label for="l-${index}">L</label>
                <input type="radio" name="size-${index}" id="xl-${index}">
                <label for="xl-${index}">XL</label>
                <input type="radio" name="size-${index}" id="xxl-${index}">
                <label for="xxl-${index}">2XL</label>
              </div>
              <button class="add-to-bag">Add to Bag</button>
            </div>
          </div>
        `);
      });
    </script>
  </div>

  <script>
    function toggleWishlist(heart) {
      heart.classList.toggle("red");
    }
  </script>
</body>
</html>
