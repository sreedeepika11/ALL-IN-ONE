        body {

            text-align: center;
        }
        .category-title {
            margin-top: 30px;
            font-size: 24px;
            font-weight: bold;
        }
        .category-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 20px;
        }
        .category {
            text-align: center;
        }
        .circle {
            width: 100px;
            height: 100px;
            background-color: #f0f0f0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s, background-color 0.3s;
            overflow: hidden;
        }
        .circle:hover {
            transform: scale(1.1);
            background-color: #ff5733;
        }
        .circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }
        .label {
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
