<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fashion Section</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .category-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 50px;
        }
        .category {
            text-align: center;
        }
        .circle {
            width: 100px;
            height: 100px;
            background-color: #f0f0f0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s, background-color 0.3s;
            overflow: hidden;
        }
        .circle:hover {
            transform: scale(1.1);
            background-color: #ffcc00;
        }
        .circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }
        .label {
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h2>Fashion Section</h2>
    
    <div class="category-container">
        <div class="category">
            <div class="circle">
                <img src="/home/rguktrkvalley/Downloads/saree.jpeg" alt="Sarees">
            </div>
            <div class="label">Sarees</div>
        </div>
        <div class="category">
            <div class="circle">
                <img src="/home/rguktrkvalley/Downloads/kurtis.jpeg" alt="Kurta Sets">
            </div>
            <div class="label">Kurta Sets</div>
        </div>
        <div class="category">
            <div class="circle">
                <img src="/home/rguktrkvalley/Downloads/western.jpeg" alt="Western Wear">
            </div>
            <div class="label">Western Wear</div>
        </div>
    </div>

    <div class="category-container">
        <div class="category">
            <div class="circle">
                <img src="/home/rguktrkvalley/Downloads/cashirts.jpeg" alt="Casual Shirts">
            </div>
            <div class="label">Casual Shirts</div>
        </div>
        <div class="category">
            <div class="circle">
                <img src="/home/rguktrkvalley/Downloads/kurtam.jpeg" alt="Men Kurta Sets">
            </div>
            <div class="label">Men Kurta Sets</div>
        </div>
        <div class="category">
            <div class="circle">
                <img src="/home/rguktrkvalley/Downloads/jeans.jpeg" alt="Jeans & Denim">
            </div>
            <div class="label">Jeans & Denim</div>
        </div>
     </div>
        
        <div class="category-container">
        <div class="category">
            <div class="circle">
                <img src="/home/rguktrkvalley/Downloads/frocks.jpeg" alt="Frocks & Dresses">
            </div>
            <div class="label">Frocks & Dresses</div>
        </div>
        <div class="category">
            <div class="circle">
                <img src="/home/rguktrkvalley/Downloads/tshirtss.jpeg" alt="T-Shirts & Polos">
            </div>
            <div class="label">T-Shirts & Polos</div>
        </div>
        
        
    
    
</body>
</html>
